; intraRP PHP Configuration
; Gegenmaßnahmen aus dem PHP-Advisory zu CVE-2026-109618 und -109619. Ein vom
; Angreifer erzwungenes Erreichen von memory_limit ist der Angriffsweg, deshalb
; -1. Erst wieder begrenzen, wenn das Basis-Image mindestens PHP 8.3.36 hat.
memory_limit = -1
; Das Advisory empfiehlt mit Uploads höchstens 32M, upload_max_filesize darunter.
; Damit sind auch Plugin-ZIPs auf 30 MB begrenzt, PluginsController liest das hier aus.
upload_max_filesize = 30M
post_max_size = 32M
session.upload_progress.enabled = 0
max_execution_time = 120
max_input_vars = 3000

; Timezone
date.timezone = Europe/Berlin

; php.ini-production setzt GPCS und laesst damit $_ENV leer. Der Bootstrap
; liest $_ENV['DB_HOST'], um zu entscheiden, ob er eine .env braucht - im
; Container kommt die Konfiguration aber ausschliesslich aus der Umgebung.
variables_order = "EGPCS"

; Error handling (controlled by APP_ENV via ErrorHandler)
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log

; Session
session.cookie_httponly = 1
session.use_strict_mode = 1

; OPcache (production)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
