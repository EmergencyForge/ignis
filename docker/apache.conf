<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Der Projektordner selbst ist nicht erreichbar; nur public/ wird
    # ausgeliefert. Die Root-.htaccess ist damit ohne Funktion, sie
    # gilt nur für Hosts, die das Docroot nicht umstellen können.
    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        # Kein MultiViews: der Front-Controller löst URLs selbst auf,
        # public/.htaccess reicht alles Unbekannte an ihn weiter.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
