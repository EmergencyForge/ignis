<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # Kein MultiViews: extensionslose URLs mappt die .htaccess per
        # RewriteRule — derselbe Pfad wie auf PHP-FPM-Hosts (KeyHelp, Plesk).
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
