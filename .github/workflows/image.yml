name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version, etwa 2026.3.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        run: echo "value=${{ inputs.version || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/emergencyforge/ignis:${{ steps.version.outputs.value }}
            ghcr.io/emergencyforge/ignis:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
