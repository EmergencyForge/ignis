name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version, etwa v2026.3.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    # ignis und das Paket-Repo WebPackages nebeneinander, wie in php.yml:
    # composer.json bindet ../WebPackages/packages/* als Pfad-Repository ein.
    defaults:
      run:
        working-directory: ignis

    steps:
      - uses: actions/checkout@v4
        with:
          path: ignis

      - name: Token fuer die Pakete
        id: packages
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PACKAGES_APP_ID }}
          private-key: ${{ secrets.PACKAGES_APP_KEY }}
          owner: EmergencyForge
          repositories: WebPackages

      - uses: actions/checkout@v4
        with:
          repository: EmergencyForge/WebPackages
          token: ${{ steps.packages.outputs.token }}
          path: WebPackages

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # :latest ist das, was eine Instanz als "neueste stabile" zieht. Ein
      # Prerelease darf den Zeiger nicht verschieben, ein Handstart auch
      # nicht: bei workflow_dispatch gibt es kein Release-Objekt, aus dem
      # sich "stabil" ablesen liesse, und der Handstart baut ohnehin meist
      # eine Reparatur oder eine aeltere Version nach. Beide Faelle deckt
      # dieselbe Bedingung ab, weil github.event.release.prerelease ohne
      # Release-Objekt leer ist.
      - name: Tags bestimmen
        id: tags
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          IMAGE=ghcr.io/emergencyforge/ignis
          VERSION="v${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "value<<TAGLISTE"
            echo "$IMAGE:$VERSION"
            if [ "$PRERELEASE" = "false" ]; then
              echo "$IMAGE:latest"
            fi
            echo "TAGLISTE"
          } >> "$GITHUB_OUTPUT"

      # storage/version.json ist die einzige Quelle, aus der die Anwendung
      # ihre Version liest (HealthController, Footer, Telemetrie). Der
      # Release-Build schreibt die Datei erst nach main; dieser Workflow
      # checkt aber den Tag-Commit aus und saehe dort den Stand davor. Also
      # hier neu schreiben, im selben Format wie build-release.yml.
      - name: version.json schreiben
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          mkdir -p storage
          cat > storage/version.json << EOF
          {
            "version": "$VERSION",
            "updated_at": "$(date -u '+%Y-%m-%d %H:%M:%S')",
            "build_number": "$GITHUB_RUN_NUMBER",
            "commit_hash": "$GITHUB_SHA"
          }
          EOF
          cat storage/version.json

      # vendor/ entsteht auf dem Runner und wandert fertig ins Image: der
      # Build-Context ist nur ignis/, ein composer install im Dockerfile
      # kaeme an WebPackages nicht heran.
      - name: Abhaengigkeiten
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          cp -rL vendor/emergencyforge vendor/emergencyforge.kopie
          rm -rf vendor/emergencyforge
          mv vendor/emergencyforge.kopie vendor/emergencyforge
          test -z "$(find vendor/emergencyforge -maxdepth 1 -type l)" \
            || { echo "vendor/emergencyforge enthaelt Symlinks"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ignis
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
